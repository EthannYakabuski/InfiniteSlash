<!DOCTYPE html><html lang="en-us"><head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<title>Avatar Mixer</title>
		<link rel="stylesheet" href="TemplateData/style.css">
	</head>

	<body style="text-align: center">
	
		<div id="gameContainer">
			<canvas id="unity-canvas" data-pixel-art="false"></canvas>
		</div>
		
		<div id="loading-cover" style="">
			<div id="unity-loading-bar">
				<div id="unity-logo"><img src="logo.png"></div>
				
				<div id="unity-progress-bar-empty" style="">
					<div id="unity-progress-bar-full" style="width: 90%;"></div>
				</div>
				
				<div class="spinner" style="display: none;"></div>
			</div>
		</div>
		
		<script src="Build/Build.loader.js"></script>
		
		<script>
		
			const loading_cover = document.querySelector("#loading-cover");
			const loading_progress_empty = document.querySelector("#unity-progress-bar-empty");
			const loading_progress_full = document.querySelector("#unity-progress-bar-full");
			const loading_spinner = document.querySelector('.spinner');
			
			loading_cover.style.display = "";
		
			createUnityInstance(document.querySelector("#unity-canvas"), {
				
				preserveDrawingBuffer: true,
				dataUrl: "Build/Build.data.unityweb",
				frameworkUrl: "Build/Build.framework.js.unityweb",
				codeUrl: "Build/Build.wasm.unityweb",
				
				
				
				streamingAssetsUrl: "StreamingAssets",
				companyName: "Kenney",
				productName: "Avatar Mixer",
				productVersion: "1.2.0",
				
				// matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
				devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
				
			},
			
			(progress) => {
			
				loading_spinner.style.display = "none";
				loading_progress_empty.style.display = "";
				loading_progress_full.style.width = `${100 * progress}%`;
				
			}).then(function(instance){
			
				loading_cover.style.display = "none";
			
				var canvas = instance.Module.canvas;
				var container = canvas.parentElement;
				
				function onResize(){
				
					var w; var h;

					if(scaleToFit) {
					
						w = window.innerWidth;
						h = window.innerHeight;
						
					}else{
					
						w = 960;
						h = 600;
						
					}

					container.style.width = canvas.style.width = w + "px";
					container.style.height = canvas.style.height = h + "px";
					container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
					container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
					
				}
			
				try{
				
					scaleToFit = !!JSON.parse("true");
					
				}catch(e){
				
					scaleToFit = true;
					
				}
				
				window.addEventListener('resize', onResize);
				onResize();
			
			});
			
		</script>
	
	
	

<script defer="" src="https://static.itch.io/htmlgame.js" type="text/javascript"></script><script src="blob:https://html-classic.itch.zone/b2e1591f-ca1e-4c05-986d-a5d5a21f7379"></script></body></html>
